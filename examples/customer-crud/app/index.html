<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCSPEC サンプル / 顧客管理</title>
<style>
:root{font-family:"Segoe UI","Yu Gothic",sans-serif;color:#173147;background:#eef3f6}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,calc((100vw - 1040px)/2));background:#102e40;color:#fff}h1{margin:8px 0;font-size:30px}.eyebrow{letter-spacing:.14em;font-size:12px;color:#7bdac3}main{max-width:1040px;margin:28px auto;padding:0 24px}.bar,.card{background:white;border:1px solid #dce6ec;border-radius:12px;padding:24px;margin-bottom:20px}.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.card h2{margin-top:0}button,select,input{font:inherit;border:1px solid #beced8;border-radius:6px;padding:9px 14px}button{cursor:pointer;background:#fff}button.primary{background:#066b67;color:#fff;border-color:#066b67}button.danger{background:#af3535;color:white;border-color:#af3535}button:disabled{cursor:not-allowed;opacity:.45}label{display:inline-flex;gap:8px;align-items:center}input[type=text]{width:min(400px,100%)}.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.muted{font-size:13px;color:#566f7f;line-height:1.7}.message{background:#fff5db;border-left:4px solid #d89420;padding:14px;margin-top:20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #e3eaf0}.state{font-size:12px;font-family:Consolas,monospace;color:#607c8e}.notice{line-height:1.8;color:#536e7d}.screen-title{display:flex;justify-content:space-between;align-items:center}footer{font-size:12px;text-align:center;color:#697e8a;margin:32px}strong{font-weight:650}
</style>
<header><div class="eyebrow">UCSPEC / SAMPLE PRODUCT</div><h1>顧客管理</h1><div>検索から閲覧へ。変更・削除は、閲覧している顧客に対して行います。</div></header>
<main><div class="bar"><label>権限 <select id="role"><option value="editor">編集可能</option><option value="reader">閲覧専用</option></select></label><label><input id="fail" type="checkbox">次の保存・削除を失敗させる</label><button id="reset">データをリセット</button></div><section id="screen" class="card" aria-live="polite"></section><p class="notice">仕様モデルとは独立した参考アプリです。仕様の検査だけでは、このアプリの実装の正しさは保証されません。再読込でデータをリセットします。通信や永続保存は行いません。</p></main><footer>検索 → 閲覧 → 変更 / 削除確認</footer>
<script>
'use strict';
(()=>{
 const $=id=>document.getElementById(id);const state={screen:'search',customer:{id:'C001',name:'サンプル商事'},message:'',query:'',draft:'',role:'editor'};
 const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
 const button=(text,fn,kind='')=>{const b=node('button',text);b.type='button';b.className=kind;b.addEventListener('click',fn);return b};
 const move=(screen,message='')=>{state.screen=screen;state.message=message;render()};
 const rejected=()=>{state.message='閲覧専用のため、この操作は実行できません。';render()};
 function render(){
  const root=$('screen');root.replaceChildren();const heading=node('div');heading.className='screen-title';heading.append(node('h2',{search:'顧客検索',results:'検索結果',view:'顧客を閲覧',editing:'顧客を変更',confirming:'削除の確認'}[state.screen]));const tag=node('span',state.screen);tag.className='state';heading.append(tag);root.append(heading);
  if(state.screen==='search'||state.screen==='results'){
   const label=node('label','顧客名 '),query=node('input');query.type='text';query.id='query';query.placeholder='サンプル';query.value=state.query;label.append(query);root.append(label,button('検索',()=>{state.query=query.value.trim();move('results')},'primary'));
   if(state.screen==='results'){
    if(state.customer&&(!state.query||state.customer.name.includes(state.query))){const table=node('table'),tr=node('tr');tr.append(node('td',state.customer.id),node('td',state.customer.name));const actions=node('td');actions.append(button('閲覧',()=>move('view')));tr.append(actions);table.append(tr);root.append(table)}else root.append(node('p','対象の顧客が見つかりません。'));
   }
  }else if(state.screen==='view'){
   if(!state.customer){move('results','対象は削除されています。');return}root.append(node('p','顧客ID: '+state.customer.id),node('p','顧客名: '+state.customer.name));const actions=node('div');actions.className='actions';actions.append(button('変更',()=>{if(state.role!=='editor'){rejected();return}state.draft=state.customer.name;move('editing')},'primary'),button('削除',()=>state.role==='editor'?move('confirming'):rejected(),'danger'),button('検索結果へ',()=>move('results')));root.append(actions);
  }else if(state.screen==='editing'){
   const label=node('label','顧客名 '),input=node('input');input.type='text';input.id='name';input.value=state.draft;label.append(input);root.append(label);const actions=node('div');actions.className='actions';actions.append(button('保存',()=>{state.draft=input.value;if(state.role!=='editor'||!state.customer){move('results','変更できません。');return}if(!state.draft.trim()){state.message='顧客名は必須です。';render();return}if($('fail').checked){$('fail').checked=false;state.message='保存に失敗しました。入力は保持しています。';render();return}state.customer.name=state.draft.trim();move('view','保存しました。')},'primary'),button('キャンセル',()=>move('view','変更を中止しました。')));root.append(actions);
  }else if(state.screen==='confirming'){
   root.append(node('p','この顧客を削除しますか？'));if(state.customer)root.append(node('strong',state.customer.name));const actions=node('div');actions.className='actions';actions.append(button('削除を実行',()=>{if(state.role!=='editor'||!state.customer){move('results','削除できません。');return}if($('fail').checked){$('fail').checked=false;state.message='削除に失敗しました。再試行できます。';render();return}state.customer=null;move('search','削除しました。')},'danger'),button('キャンセル',()=>move('view','削除を中止しました。')));root.append(actions);
  }
  if(state.message){const msg=node('p',state.message);msg.className='message';msg.setAttribute('role','status');root.append(msg)}
 }
 $('role').onchange=()=>{state.role=$('role').value;move('search')};$('reset').onclick=()=>{state.customer={id:'C001',name:'サンプル商事'};state.query='';$('fail').checked=false;move('search','データをリセットしました。')};render();
})();
</script></html>
